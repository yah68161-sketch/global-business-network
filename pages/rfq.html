<section class="features">
    <div class="section-heading">
        <p>SMART REQUEST FOR QUOTATION</p>
        <h2>Find the Right Business Deal</h2>
        <p>Create a request and connect with potential suppliers.</p>
    </div>

    <div class="feature-card" style="max-width:650px; margin:auto;">
        <form id="rfqForm">
            <label>Product or Service</label>
            <input type="text" placeholder="What do you need?" required>

            <br><br>

            <label>Quantity</label>
            <input type="number" placeholder="Enter quantity" required>

            <br><br>

            <label>Destination Country</label>
            <input type="text" placeholder="Enter country" required>

            <br><br>

            <label>Additional Details</label>
            <textarea placeholder="Describe your requirements..." rows="5"></textarea>

            <br><br>

            <button type="submit" class="primary-btn">Submit RFQ</button>
        </form>
        <p id="rfqMessage"></p>
    </div>
</section>

<footer>
    <h2>GBN<span>.</span></h2>
    <p>A New Global Business Ecosystem</p>
</footer>

<script>
document.getElementById("rfqForm").addEventListener("submit", function(event) {
    event.preventDefault();
    document.getElementById("rfqMessage").textContent =
        "Demo: Your RFQ form is ready. Backend connection is not active yet.";
});
</script>
